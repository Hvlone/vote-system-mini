# 生产环境配置模板 / 清单（本文件进版本库，只作模板与说明，切勿在此填真实密钥）
#
# 用法二选一：
#   A) 纯环境变量注入（推荐，不必落地文件）
#      激活 prod profile，并在部署环境注入下列环境变量即可，本文件仅当清单参考：
#        SPRING_PROFILES_ACTIVE=prod
#        DB_URL / DB_USERNAME / DB_PASSWORD / JWT_SECRET / IP_TRUST_PROXIES
#        WECHAT_APPID / WECHAT_SECRET
#   B) 落地配置文件
#      复制本文件为同目录下的 application-prod.yml
#      （该校验名已在根 .gitignore 中忽略，内容不会进版本库），
#      再把下面的 ${XXX} 换成真实值，或保留 ${XXX} 继续由环境变量注入。
#
# 启动方式（任选其一）：
#   java -jar vote-system-backend-1.0.0.jar --spring.profiles.active=prod
#   PowerShell 先设 $env:SPRING_PROFILES_ACTIVE="prod" 再启动
#
# 环境变量清单：
#   DB_URL            数据库连接串（含库名与参数）
#   DB_USERNAME       数据库账号
#   DB_PASSWORD       数据库密码
#   JWT_SECRET        JWT 签名密钥，长度 >= 32 字节；不设默认值，未注入则启动失败
#   IP_TRUST_PROXIES  是否位于受信反向代理之后：走 Nginx 必须 true；直连保持 false
#   WECHAT_APPID      微信小程序 AppID
#   WECHAT_SECRET     微信小程序 AppSecret
server:
  port: 8080

spring:
  application:
    name: vote-system-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库与后端同机时可保持 useSSL=false；跨机请改用 useSSL=true
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

# JWT：密钥必须由环境变量注入，未注入直接启动失败（避免误用开发默认密钥上线）
jwt:
  secret: ${JWT_SECRET}
  expire-hours: 2

# IP 获取：经 Nginx 等反向代理时必须置为 true，且代理要覆盖 X-Forwarded-For/X-Real-IP，
# 否则限流会把所有请求都记成代理 IP；直连部署保持 false，避免客户端伪造请求头绕过限流
ip:
  trust-proxies: ${IP_TRUST_PROXIES:false}

# 微信小程序登录
wechat:
  # 未注入时登录接口会明确报「服务端未配置微信登录参数」，不影响其余接口
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_SECRET:}
  # 生产强制关闭调试登录：test_ 前缀的 code 不再能直接换取登录态
  debug-login-enabled: false
