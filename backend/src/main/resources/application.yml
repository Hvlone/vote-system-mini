# 开发环境默认配置。
# 敏感项一律写成 ${环境变量:开发默认值}：本地开发零改动即可跑；
# 生产请激活 prod profile（在 application-prod.example.yml 中复制为 application-prod.yml，
# 该文件不进版本库），或直接注入下列环境变量做覆盖：
#   DB_URL / DB_USERNAME / DB_PASSWORD / JWT_SECRET / IP_TRUST_PROXIES
#   WECHAT_APPID / WECHAT_SECRET / WECHAT_DEBUG_LOGIN
server:
  port: 8080

spring:
  application:
    name: vote-system-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/vote_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:111111}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

# JWT 配置
jwt:
  # 生产务必通过 JWT_SECRET 注入新密钥并妥善保管（长度需 >= 32 字节）。
  # 此处默认值仅供本地开发；prod profile 中该键不设默认值，缺失会直接启动失败
  secret: ${JWT_SECRET:vote-system-jwt-secret-key-please-change-in-prod-2026}
  expire-hours: 2

# IP 获取：是否部署在受信反向代理之后（true 时信任 X-Forwarded-For/X-Real-IP，需代理覆盖这些头）
ip:
  trust-proxies: ${IP_TRUST_PROXIES:false}

# 微信小程序登录（code2session 换取 openid）
wechat:
  # 生产环境务必通过 WECHAT_APPID / WECHAT_SECRET 注入，不要把真实 secret 提交到版本库
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_SECRET:}
  # 调试登录：code 以 test_ 开头时直接取后段作为 openid（不调微信），仅供本地联调。
  # 生产必须为 false（prod profile 已强制关闭；代码侧默认值同样是 false）
  debug-login-enabled: ${WECHAT_DEBUG_LOGIN:true}
