server:
  port: 8080

spring:
  application:
    name: vote-system-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/vote_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "111111"

mybatis:
  configuration:
    map-underscore-to-camel-case: true

# JWT 配置
jwt:
  # 生产环境务必更换并妥善保管（长度需 >= 32 字节）
  secret: vote-system-jwt-secret-key-please-change-in-prod-2026
  expire-hours: 2

# IP 获取：是否部署在受信反向代理之后（true 时信任 X-Forwarded-For/X-Real-IP，需代理覆盖这些头）
ip:
  trust-proxies: false
